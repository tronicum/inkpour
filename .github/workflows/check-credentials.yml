name: Check store-publishing credentials

# Daily check that release.yml's store credentials (Chrome Web Store OAuth,
# Microsoft Edge Partner Center API key) still actually work, plus an
# early-warning day-count against Edge's fixed ~72-day API key expiry.
#
# Why this exists: both of these have failed silently before -- a real tag
# push hit "invalid_grant" on Chrome and a blank-secrets 404 on Edge, and the
# first anyone knew was a half-published release. This surfaces the same
# failure on an ordinary Tuesday instead, via one tracking issue that updates
# in place (never duplicates) and closes itself the day credentials are
# healthy again -- so "is publishing still going to work" never depends on
# remembering to check.
#
# This workflow only ever READS from the stores (a token refresh / a GET) --
# it never uploads or publishes anything.

on:
  schedule:
    - cron: '0 8 * * *'  # daily, offset from ci.yml's 06:00 and check-forks.yml's 07:00
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-chrome:
    name: Check Chrome Web Store OAuth token
    runs-on: ubuntu-latest
    environment: Chrome
    outputs:
      status: ${{ steps.check.outputs.status }}
      detail:  ${{ steps.check.outputs.detail }}
    steps:
      - name: Attempt a token refresh (read-only — never uploads anything)
        id: check
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set +e
          response=$(curl -s -w '\n%{http_code}' -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "Chrome OAuth token refresh succeeded."
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            reason=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.error_description||j.error||'unknown error');}catch{console.log('unparseable response');}})" 2>/dev/null)
            detail="HTTP ${http_code}: ${reason}"
            echo "detail=${detail}" >> "$GITHUB_OUTPUT"
            echo "::warning::Chrome OAuth token check failed — ${detail}"
          fi

  check-edge:
    name: Check Microsoft Edge Partner Center API key
    runs-on: ubuntu-latest
    environment: Edge
    outputs:
      status: ${{ steps.check.outputs.status }}
      detail:  ${{ steps.check.outputs.detail }}
      days_since_rotation: ${{ steps.check.outputs.days_since_rotation }}
    steps:
      - name: Attempt an authenticated read (read-only — never uploads anything)
        id: check
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID:  ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY:    ${{ secrets.EDGE_API_KEY }}
          # Plain repo variable (not a secret) — update this to today's date
          # (YYYY-MM-DD) every time EDGE_API_KEY is re-minted in Partner
          # Center, via Settings -> Secrets and variables -> Actions ->
          # Variables -> EDGE_API_KEY_ROTATED_AT. If this is never updated,
          # the day-count warning below just never fires — the live
          # authenticated-read check above still catches an actual failure
          # regardless.
          ROTATED_AT: ${{ vars.EDGE_API_KEY_ROTATED_AT }}
        run: |
          set +e
          # /v1/products/{id}/submissions (list) is the one read-only GET in
          # this same API family release.yml's own polling already proves
          # exists (it polls sibling paths under .../submissions/operations/
          # and .../submissions/draft/package/operations/) — deliberately not
          # guessing at an endpoint the real publish job never exercises.
          http_code=$(curl -s -o /tmp/edge-check-body.json -w '%{http_code}' \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions")

          if [ "$http_code" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "Edge Partner Center API key check succeeded."
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "detail=HTTP ${http_code} from Partner Center" >> "$GITHUB_OUTPUT"
            echo "::warning::Edge API key check failed — HTTP ${http_code}"
          fi
          rm -f /tmp/edge-check-body.json

          days=""
          if [ -n "$ROTATED_AT" ]; then
            rotated_epoch=$(date -d "$ROTATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%d" "$ROTATED_AT" +%s 2>/dev/null)
            if [ -n "$rotated_epoch" ]; then
              now_epoch=$(date +%s)
              days=$(( (now_epoch - rotated_epoch) / 86400 ))
            fi
          fi
          echo "days_since_rotation=${days:-unknown}" >> "$GITHUB_OUTPUT"

  report:
    name: Report credential health
    runs-on: ubuntu-latest
    needs: [check-chrome, check-edge]
    if: always()
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      CHROME_STATUS: ${{ needs.check-chrome.outputs.status }}
      CHROME_DETAIL: ${{ needs.check-chrome.outputs.detail }}
      EDGE_STATUS:   ${{ needs.check-edge.outputs.status }}
      EDGE_DETAIL:   ${{ needs.check-edge.outputs.detail }}
      EDGE_DAYS:     ${{ needs.check-edge.outputs.days_since_rotation }}
      # Early-warning threshold: Edge's API key expires ~72 days after
      # minting: warn with real runway left, not on the day it breaks.
      EDGE_WARN_AT_DAYS: 55
    steps:
      - name: Compare results and update the tracking issue
        run: |
          set -euo pipefail

          problems=""
          [ "$CHROME_STATUS" = "failed" ] && problems="${problems}chrome"
          [ "$EDGE_STATUS" = "failed" ]   && problems="${problems}edge"

          edge_aging_warning=false
          if [ "$EDGE_STATUS" = "ok" ] && [ "$EDGE_DAYS" != "unknown" ] && [ "$EDGE_DAYS" -ge "$EDGE_WARN_AT_DAYS" ]; then
            edge_aging_warning=true
            problems="${problems}edge-aging"
          fi

          title="⚠️ Store publishing credentials need attention"
          existing=$(gh issue list --repo "$REPO" --label credentials --state open --json number --jq '.[0].number' || true)

          if [ -z "$problems" ]; then
            echo "Both credentials healthy${EDGE_DAYS:+ (Edge key age: ${EDGE_DAYS}d)}. Nothing to report."
            if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "Both credentials are healthy again as of this run (Edge key age: ${EDGE_DAYS}d). Closing."
              gh issue close "$existing" --repo "$REPO"
            fi
            exit 0
          fi

          body="Daily credential check found a problem. This workflow only reads from each store (a token refresh / a GET) — nothing was uploaded or published."
          body="${body}"$'\n\n'"Checked: $(date -u +'%Y-%m-%d %H:%M UTC')"

          if [ "$CHROME_STATUS" = "failed" ]; then
            body="${body}"$'\n\n'"### Chrome Web Store — OAuth token check failed"
            body="${body}"$'\n'"${CHROME_DETAIL}"
            body="${body}"$'\n\n'"If this is \`invalid_grant\`: the OAuth consent screen is almost certainly still in **Testing** status, which caps refresh tokens at 7 days — this is the same failure that's hit before. The permanent fix: Google Cloud Console → APIs & Services → OAuth consent screen → **Publish App** (to Production). \`chromewebstore\` isn't a sensitive/restricted scope, so this shouldn't need Google's verification review. Then re-mint \`REFRESH_TOKEN\` once more (same loopback-redirect exchange as before) and it should stop expiring on its own after that."
          fi

          if [ "$EDGE_STATUS" = "failed" ]; then
            body="${body}"$'\n\n'"### Microsoft Edge Add-ons — API key check failed"
            body="${body}"$'\n'"${EDGE_DETAIL}"
            body="${body}"$'\n\n'"Partner Center → Microsoft Edge → Publish API → re-mint the API key, then \`gh secret set EDGE_API_KEY --env Edge --repo ${REPO}\` with the new value. Also update the \`EDGE_API_KEY_ROTATED_AT\` repo variable to today's date so the day-count warning below resets."
          fi

          if [ "$edge_aging_warning" = "true" ]; then
            body="${body}"$'\n\n'"### Microsoft Edge Add-ons — API key aging out soon"
            body="${body}"$'\n'"Still authenticating fine, but it's been **${EDGE_DAYS} days** since \`EDGE_API_KEY_ROTATED_AT\` (Edge keys expire ~72 days after minting) — worth re-minting proactively rather than waiting for it to actually fail. Same steps as above."
          fi

          if [ -n "${existing:-}" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Updated existing issue #$existing."
          else
            gh issue create --repo "$REPO" --title "$title" --label credentials --body "$body"
            echo "Opened a new tracking issue."
          fi
