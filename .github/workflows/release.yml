name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          NAME=$(node -e "
            const raw = require('./manifest.json').name;
            const m = raw.match(/^__MSG_(\w+)__\$/);
            if (!m) { process.stdout.write(raw); }
            else { process.stdout.write(require('./_locales/en/messages.json')[m[1]].message); }
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME"       >> $GITHUB_OUTPUT
          # scripts/release.sh writes next to the checkout, not inside it
          echo "zip=../inkpour-$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          MANIFEST="${{ steps.meta.outputs.version }}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "✗ Tag $GITHUB_REF_NAME doesn't match manifest version $MANIFEST"
            exit 1
          fi
          echo "✓ Tag and manifest version both: $MANIFEST"

      - name: Build extension zip
        # scripts/release.sh is the single source of truth for what's
        # included/excluded in the shipped package — this used to be a
        # second, hand-maintained --exclude list right here, which had
        # drifted out of sync with scripts/release.sh (e.g. it excluded all
        # of debug/, breaking Settings' "Import debug"/"PDF fuzzer" links in
        # every real install; see CHANGELOG.md Unreleased / TODOs.md Batch
        # 11). Calling the script here means there's only ever one place
        # that decides what ships.
        run: |
          bash scripts/release.sh "${{ steps.meta.outputs.version }}"
          echo "✓ Built ${{ steps.meta.outputs.zip }} ($(du -sh ${{ steps.meta.outputs.zip }} | cut -f1))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}"
          files: ${{ steps.meta.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-firefox:
    name: Publish to Firefox Add-ons (AMO)
    needs: release
    runs-on: ubuntu-latest
    # A GitHub Environment named "Firefox" scopes these secrets to just this
    # job and lets you optionally require manual approval before it runs
    # (Settings → Environments → New environment → "Firefox" → add required
    # reviewers). The environment is auto-created on first run if it
    # doesn't exist yet, but with no protection rules until configured.
    environment: Firefox
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip (same script as the release job, so the
          submitted package is byte-identical to what's on the GitHub Release)
        run: bash scripts/release.sh

      - name: Unpack for web-ext (it signs a source directory, not a zip)
        run: |
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          mkdir -p unpacked
          unzip -q "../inkpour-${VERSION}.zip" -d unpacked

      - name: Submit to Firefox Add-ons (AMO)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext@10 sign \
            --source-dir unpacked \
            --artifacts-dir web-ext-artifacts \
            --channel listed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

      - name: Upload signed artifact (for inspection if anything looks off)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-submission
          path: web-ext-artifacts/
          retention-days: 14

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: release
    runs-on: ubuntu-latest
    # Mirrors publish-firefox's Environment pattern — see TODOs.md "Batch 10"
    # for the one-time Google Cloud / OAuth setup needed to populate these
    # four secrets (EXTENSION_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN).
    environment: Chrome
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip (same script as the release job, so the
          submitted package is byte-identical to what's on the GitHub Release)
        run: bash scripts/release.sh

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          npx chrome-webstore-upload-cli@3 upload \
            --source "../inkpour-${VERSION}.zip" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
          npx chrome-webstore-upload-cli@3 publish \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
