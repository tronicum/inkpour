name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          NAME=$(node -e "
            const raw = require('./manifest.json').name;
            const m = raw.match(/^__MSG_(\w+)__\$/);
            if (!m) { process.stdout.write(raw); }
            else { process.stdout.write(require('./_locales/en/messages.json')[m[1]].message); }
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME"       >> $GITHUB_OUTPUT
          # scripts/release.sh writes next to the checkout, not inside it
          echo "zip=../inkpour-$VERSION.zip" >> $GITHUB_OUTPUT

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          MANIFEST="${{ steps.meta.outputs.version }}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "✗ Tag $GITHUB_REF_NAME doesn't match manifest version $MANIFEST"
            exit 1
          fi
          echo "✓ Tag and manifest version both: $MANIFEST"

      - name: Build extension zip
        # scripts/release.sh is the single source of truth for what's
        # included/excluded in the shipped package — this used to be a
        # second, hand-maintained --exclude list right here, which had
        # drifted out of sync with scripts/release.sh (e.g. it excluded all
        # of debug/, breaking Settings' "Import debug"/"PDF fuzzer" links in
        # every real install; see CHANGELOG.md Unreleased / TODOs.md Batch
        # 11). Calling the script here means there's only ever one place
        # that decides what ships.
        run: |
          bash scripts/release.sh "${{ steps.meta.outputs.version }}"
          echo "✓ Built ${{ steps.meta.outputs.zip }} ($(du -sh ${{ steps.meta.outputs.zip }} | cut -f1))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}"
          files: ${{ steps.meta.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-firefox:
    name: Publish to Firefox Add-ons (AMO)
    needs: release
    runs-on: ubuntu-latest
    # A GitHub Environment named "Firefox" scopes these secrets to just this
    # job and lets you optionally require manual approval before it runs
    # (Settings → Environments → New environment → "Firefox" → add required
    # reviewers). The environment is auto-created on first run if it
    # doesn't exist yet, but with no protection rules until configured.
    environment: Firefox
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip (same script as the release job, so the
          submitted package is byte-identical to what's on the GitHub Release)
        run: bash scripts/release.sh

      - name: Unpack for web-ext (it signs a source directory, not a zip)
        run: |
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          mkdir -p unpacked
          unzip -q "../inkpour-${VERSION}.zip" -d unpacked

      - name: Submit to Firefox Add-ons (AMO)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext@10 sign \
            --source-dir unpacked \
            --artifacts-dir web-ext-artifacts \
            --channel listed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

      - name: Upload signed artifact (for inspection if anything looks off)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-submission
          path: web-ext-artifacts/
          retention-days: 14

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: release
    runs-on: ubuntu-latest
    # Mirrors publish-firefox's Environment pattern — see TODOs.md "Batch 10"
    # for the one-time Google Cloud / OAuth setup needed to populate these
    # four secrets (EXTENSION_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN).
    environment: Chrome
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip (same script as the release job, so the
          submitted package is byte-identical to what's on the GitHub Release)
        run: bash scripts/release.sh

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          npx chrome-webstore-upload-cli@3 upload \
            --source "../inkpour-${VERSION}.zip" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
          npx chrome-webstore-upload-cli@3 publish \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: release
    runs-on: ubuntu-latest
    # Same Environment pattern as Chrome/Firefox — see TODOs.md "Batch 10" for
    # the one-time Partner Center setup needed to populate these secrets
    # (EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY). Uses the v1.1 (API key)
    # auth flow, not the older v1 OAuth-token flow. Unlike Firefox/Chrome,
    # Edge's API has no create-product endpoint — the very first submission
    # must be done manually in Partner Center before this job can run at all,
    # and EDGE_API_KEY expires roughly every 72 days and needs re-minting.
    environment: Edge
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip (same script as the release job, so the
          submitted package is byte-identical to what's on the GitHub Release)
        run: bash scripts/release.sh

      - name: Strip background.scripts for Edge's stricter MV3 validator
        # manifest.json intentionally ships BOTH background.service_worker
        # (Chrome/Edge/modern Firefox) and background.scripts (older Firefox,
        # pre-service_worker MV3 support, as an event-page fallback) — see
        # commit 01526b8. Chrome's own validator tolerates both keys being
        # present and just uses service_worker, but Edge's Partner Center
        # validator rejects the manifest outright if scripts is present at
        # all under manifest_version 3, regardless of which key it would
        # actually use. Rather than touching the shared manifest.json (which
        # would risk breaking Firefox's fallback), patch only this Edge zip.
        run: |
          set -euo pipefail
          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          ZIP_PATH=$(cd .. && pwd)/inkpour-${VERSION}.zip
          WORKDIR=$(mktemp -d)
          unzip -q "$ZIP_PATH" -d "$WORKDIR"
          node -e "
            const fs = require('fs');
            const path = 'manifest.json';
            const dir = process.argv[1];
            const full = dir + '/' + path;
            const manifest = JSON.parse(fs.readFileSync(full, 'utf8'));
            delete manifest.background.scripts;
            fs.writeFileSync(full, JSON.stringify(manifest, null, 2) + '\n');
          " "$WORKDIR"
          rm "$ZIP_PATH"
          (cd "$WORKDIR" && zip -qr "$ZIP_PATH" .)
          echo "✓ Patched background.scripts out of the Edge submission zip: $ZIP_PATH"

      - name: Upload and publish to Microsoft Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          API="https://api.addons.microsoftedge.microsoft.com"
          AUTH_HEADER="Authorization: ApiKey ${EDGE_API_KEY}"
          CLIENTID_HEADER="X-ClientID: ${EDGE_CLIENT_ID}"

          VERSION=$(node -e "process.stdout.write(require('./manifest.json').version)")
          ZIP_PATH="../inkpour-${VERSION}.zip"

          echo "Uploading ${ZIP_PATH} to product ${EDGE_PRODUCT_ID}..."
          upload_headers=$(mktemp)
          upload_status=$(curl -sS -o /dev/null -w '%{http_code}' -D "$upload_headers" \
            -H "$AUTH_HEADER" -H "$CLIENTID_HEADER" -H "Content-Type: application/zip" \
            -X POST -T "$ZIP_PATH" \
            "${API}/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package")

          if [ "$upload_status" != "202" ]; then
            echo "::error::Upload failed with HTTP $upload_status"
            cat "$upload_headers"
            exit 1
          fi

          upload_op_id=$(grep -i '^Location:' "$upload_headers" | sed -E 's#.*/operations/([^/[:space:]]+).*#\1#i' | tr -d '\r')
          echo "Upload accepted — operation ID: ${upload_op_id}"

          poll_operation() {
            local kind="$1" op_id="$2" url="$3"
            for attempt in $(seq 1 20); do
              sleep 10
              response=$(curl -sS -H "$AUTH_HEADER" -H "$CLIENTID_HEADER" "$url")
              status=$(echo "$response" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).status||'')}catch{console.log('')}})")
              echo "  [$kind] attempt $attempt: status=${status:-unknown}"
              if [ "$status" = "Succeeded" ]; then
                return 0
              fi
              if [ "$status" = "Failed" ]; then
                echo "::error::$kind operation failed"
                echo "$response"
                return 1
              fi
            done
            echo "::error::$kind operation timed out after 20 attempts"
            return 1
          }

          poll_operation "Upload" "$upload_op_id" \
            "${API}/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${upload_op_id}"

          echo "Publishing submission..."
          publish_headers=$(mktemp)
          publish_status=$(curl -sS -o /dev/null -w '%{http_code}' -D "$publish_headers" \
            -H "$AUTH_HEADER" -H "$CLIENTID_HEADER" -H "Content-Type: application/json" \
            -X POST -d '{"notes":"Automated release from CI"}' \
            "${API}/v1/products/${EDGE_PRODUCT_ID}/submissions")

          if [ "$publish_status" != "202" ]; then
            echo "::error::Publish failed with HTTP $publish_status"
            cat "$publish_headers"
            exit 1
          fi

          publish_op_id=$(grep -i '^Location:' "$publish_headers" | sed -E 's#.*/operations/([^/[:space:]]+).*#\1#i' | tr -d '\r')
          echo "Publish accepted — operation ID: ${publish_op_id}"

          poll_operation "Publish" "$publish_op_id" \
            "${API}/v1/products/${EDGE_PRODUCT_ID}/submissions/operations/${publish_op_id}"

          echo "✓ Published to Microsoft Edge Add-ons."
